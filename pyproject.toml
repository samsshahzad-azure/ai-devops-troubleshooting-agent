[project]
name = "ai-devops-troubleshooting-agent"
version = "0.1.0"
description = "A local-first AI assistant for Kubernetes troubleshooting."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "groq>=0.11,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
    "kubernetes>=30.0,<31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = ["pytest>=8.3,<9.0"]
