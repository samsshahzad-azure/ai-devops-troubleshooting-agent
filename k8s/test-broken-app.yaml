apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-app
  namespace: ai-agent-test
  labels:
    app: broken-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-app
  template:
    metadata:
      labels:
        app: broken-app
    spec:
      containers:
        - name: broken-container
          image: nonexistent-registry.example.com/nonexistent-image:nonexistent-tag
          imagePullPolicy: Always
